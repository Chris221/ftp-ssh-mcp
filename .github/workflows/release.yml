name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22: OIDC trusted publishing (`npm publish --provenance`
          # with no NODE_AUTH_TOKEN) requires npm >= 11.5.1, and setup-node's
          # Node 22 still ships npm 10.x — the first tag push would have failed
          # with ENEEDAUTH. ci.yml's matrix is unaffected and still covers 20.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check tag version matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
